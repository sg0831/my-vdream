[project]
name = "my-vdream-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "cryptography>=42",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "python-multipart>=0.0.9",
  "openpyxl>=3.1",
  "boto3>=1.34",
  "slowapi>=0.1.9",
  "alembic>=1.14",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
